<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <title>Objects</title>
        <style>
            p, h2{
                margin: 10px;
            }
            /* This property of 'display' changes the in-line elements "span" tags to block elements by setting it to block */
            span{
                padding: 8px;
                border: 2px solid #000000;
                margin: 10px;
                display: inline-block;
            }
            div{
                padding:10px;
                margin:10px;
                border: 2px solid black;
            }
        </style>
    </head>
    <body>
        <h2>These are inline elements</h2>
        <span class="In-line">inline element</span>
        <span class="In-line">inline element</span>
        <span class="In-line">inline element</span>
        <span class="In-line">inline element</span>
        <span class="In-line">inline element</span>
        <span class="In-line">inline element</span>
        <span class="In-line">inline element</span>
        <span class="In-line">inline element</span>
        <span class="In-line">inline element</span>
        <span class="In-line">inline element</span>
        <br>
        <p> Examples of block elements</p>
        <div class="block">Block element</div>
        <div class="block">Block element</div>
        <div class="block">Block element</div>
        <div class="block">Block element</div>
        <div class="block">Block element</div>
    </body>
</html>
